name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate package contents
        run: npm pack --dry-run

  packaged-install-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Secretless packaged install smoke
        run: npm run smoke:pack-install

  windows-native-secret-store-cert:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Certify Windows native secret-store path
        run: npm run smoke:windows:native-secret-store

  windows-installer-package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Install dependencies
        run: npm ci

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 7.0.0
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Validate Windows packaging metadata
        run: npm run validate:windows-packaging

      - name: Build Windows MSI
        run: npm run package:windows-msi -- --out-dir artifacts/windows-installer

      - name: Smoke installed MSI from PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $msi = Get-ChildItem -Path "artifacts/windows-installer" -Filter "*.msi" | Select-Object -First 1
          if (!$msi) {
            throw "MSI artifact was not produced."
          }

          $installLog = Join-Path $env:RUNNER_TEMP "xyte-cli-msi-install.log"
          & msiexec.exe /i $msi.FullName /qn /norestart /l*v $installLog
          if ($LASTEXITCODE -ne 0) {
            Get-Content -LiteralPath $installLog -Tail 200
            throw "MSI install failed with exit code $LASTEXITCODE."
          }

          $installDir = Join-Path $env:ProgramFiles "Xyte CLI"
          $xyteCliCmd = Join-Path $installDir "xyte-cli.cmd"
          if (!(Test-Path -LiteralPath $xyteCliCmd)) {
            throw "Installed xyte-cli.cmd not found at $xyteCliCmd."
          }

          $machinePath = [Environment]::GetEnvironmentVariable("Path", "Machine")
          $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
          $env:Path = @($machinePath, $userPath) -join ";"

          where.exe xyte-cli
          xyte-cli --version
          xyte-cli doctor environment --format text

      - name: Upload Windows MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: |
            artifacts/windows-installer/*.msi
            artifacts/windows-installer/windows-installer-manifest.json
            artifacts/windows-installer/winget/*.yaml

  linux-native-secret-store-cert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux secret-store dependencies
        run: sudo apt-get update && sudo apt-get install -y dbus-x11 gnome-keyring libsecret-tools

      - name: Build
        run: npm run build

      - name: Certify Linux native secret-store path
        run: |
          dbus-run-session -- bash -lc 'eval "$(printf "xyte-cli-ci-password" | gnome-keyring-daemon --unlock --components=secrets)"; npm run smoke:linux:native-secret-store'

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit high/critical vulnerabilities
        run: npm audit --audit-level=high

  upgrade-controlled-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Controlled upgrade docker smoke
        run: npm run smoke:upgrade:controlled
