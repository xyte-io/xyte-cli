name: Release Assets

on:
  push:
    tags:
      - "v*.*.*"
      - "*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to package (e.g. 0.1.0 or v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-assets
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Resolve tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          TAG="${TAG#refs/tags/}"
          VERSION="${TAG#v}"

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '${TAG}' is not a valid semver tag."
            exit 1
          fi

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

  packaged-install-smoke:
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ needs.meta.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Secretless packaged install smoke
        run: npm run smoke:pack-install

  release:
    # windows-msi must stay out of this needs list: a Windows toolchain failure
    # must not block the npm tarball/SBOM release (see docs/release.md).
    needs: [meta, packaged-install-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ needs.meta.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate package version matches tag
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${{ needs.meta.outputs.version }}"
          if [[ "${PACKAGE_VERSION}" != "${TAG_VERSION}" ]]; then
            echo "::error::package.json version (${PACKAGE_VERSION}) does not match tag (${TAG_VERSION})."
            exit 1
          fi

      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm pack

      - name: Generate SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm --output-file sbom.cdx.json --omit dev

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256sum *.tgz sbom.cdx.json > checksums.txt

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            *.tgz
            sbom.cdx.json
            checksums.txt

  windows-msi:
    needs: [meta, release]
    runs-on: windows-latest
    # The `release` environment holds the Azure Artifact Signing settings; its
    # federated credential only trusts this environment.
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ needs.meta.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Install dependencies
        run: npm ci

      - name: Validate package version matches tag
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${{ needs.meta.outputs.version }}"
          if [[ "${PACKAGE_VERSION}" != "${TAG_VERSION}" ]]; then
            echo "::error::package.json version (${PACKAGE_VERSION}) does not match tag (${TAG_VERSION})."
            exit 1
          fi

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 7.0.0
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Validate Windows packaging metadata
        run: npm run validate:windows-packaging

      - name: Build Windows MSI
        run: npm run package:windows-msi -- --out-dir artifacts/windows-installer

      # Signing stays off until AZURE_SIGNING_CERT_PROFILE is set on the release
      # environment, which needs Microsoft's identity validation to complete first.
      - name: Azure login
        if: vars.AZURE_SIGNING_CERT_PROFILE != ''
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows MSI
        if: vars.AZURE_SIGNING_CERT_PROFILE != ''
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_CERT_PROFILE }}
          files: ${{ github.workspace }}\artifacts\windows-installer\XyteCLI-${{ needs.meta.outputs.version }}-win-x64.msi
          description: Xyte CLI

      - name: Verify MSI signature
        if: vars.AZURE_SIGNING_CERT_PROFILE != ''
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature "artifacts/windows-installer/XyteCLI-${{ needs.meta.outputs.version }}-win-x64.msi"
          "Status: $($sig.Status); signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "MSI signature is $($sig.Status)" }

      - name: Point WinGet manifests at the signed MSI
        if: vars.AZURE_SIGNING_CERT_PROFILE != ''
        run: npm run package:windows-msi -- --out-dir artifacts/windows-installer --manifests-only

      - name: Generate Windows checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/windows-installer
          sha256sum *.msi windows-installer-manifest.json winget/*.yaml > windows-checksums.txt

      - name: Upload Windows MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: |
            artifacts/windows-installer/*.msi
            artifacts/windows-installer/windows-installer-manifest.json
            artifacts/windows-installer/winget/*.yaml
            artifacts/windows-installer/windows-checksums.txt

      - name: Publish Windows release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          files: |
            artifacts/windows-installer/*.msi
            artifacts/windows-installer/windows-installer-manifest.json
            artifacts/windows-installer/winget/*.yaml
            artifacts/windows-installer/windows-checksums.txt

      - name: Verify Windows release assets attached
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets="$(gh release view "${{ needs.meta.outputs.tag }}" --repo "${{ github.repository }}" --json assets --jq '.assets[].name')"
          for expected in \
            "XyteCLI-${{ needs.meta.outputs.version }}-win-x64.msi" \
            "windows-installer-manifest.json" \
            "windows-checksums.txt" \
            "Xyte.XyteCLI.yaml" \
            "Xyte.XyteCLI.installer.yaml" \
            "Xyte.XyteCLI.locale.en-US.yaml"; do
            if ! grep -Fxq "$expected" <<<"$assets"; then
              echo "::error::Windows release asset missing: $expected"
              exit 1
            fi
          done
