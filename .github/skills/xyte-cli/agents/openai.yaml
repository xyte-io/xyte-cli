interface:
  display_name: "Xyte Ops Agent"
  short_description: "Deterministic Xyte CLI ops: first-run setup, api calls, ops inspect/report, util workflows, and headless JSON."
  default_prompt: "Use $xyte-cli as the operational router for @xyteai/cli. Invoke commands directly with `xyte-cli` and stay on the public v2 surface: `init`, `config`, `api`, `ops`, `util`, and `flow`. If `xyte-cli` is unavailable on PATH, use `npx @xyteai/cli@latest <command>` or `npm exec @xyteai/cli@latest -- <command>` until PATH is fixed. For fresh installs use `xyte-cli init`, then `xyte-cli setup run --tenant <tenant-id>` for humans or pipe the key on stdin into `xyte-cli setup run --non-interactive --tenant <tenant-id> --key-stdin` for automation. Prefer `xyte-cli setup status --field tenantId` when you only need the tenant id, prefer JSON outputs, use `xyte-cli ops console --headless --output json` for machine frames, use `--out` on inspect/watch commands when downstream steps need a file, and generate reports with `xyte-cli ops report generate` (PDF default, redacted unless include-sensitive is explicitly requested). Do not use source/dev entrypoints like tsx, src, dist, or bin paths."
