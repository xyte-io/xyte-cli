interface:
  display_name: 'Xyte Ops Agent'
  short_description: 'Deterministic Xyte CLI ops: first-run setup, api calls, ops inspect/report, util workflows, and headless JSON.'
  default_prompt: 'Use $xyte-cli as the operational router for @xyteai/cli. Invoke commands directly with `xyte-cli` and stay on the public v2 surface: `init`, `config`, `api`, `ops`, `util`, and `flow`. If `xyte-cli` is unavailable on PATH, run `npx -y @xyteai/cli@latest doctor environment --format json` and use the command prefix from `recommendations`; `npm exec -- @xyteai/cli@latest <command>` also works until PATH is fixed. For fresh installs run `xyte-cli doctor environment --format json` first, then `xyte-cli setup run --tenant <tenant-id>` for humans or `xyte-cli setup run --non-interactive --tenant <tenant-id> --key-file <path-outside-workspace>` / `--key-stdin` / `--key-command "<cmd>"` (for secret managers like 1Password `op read`, Vault, AWS Secrets Manager) for automation; after setup succeeds run `xyte-cli init --scope project --agents all --force --no-setup`. Persisted credentials default to secure OS-native storage (macOS Keychain, Windows DPAPI, Linux Secret Service); if `xyte-cli` warns on `stderr` that it fell back to file storage, do not treat that warning alone as command failure. Prefer `xyte-cli setup status --field tenantId` when you only need the tenant id, prefer JSON outputs, use `xyte-cli ops console --headless --output json` for machine frames, use `--out` on inspect/watch commands when downstream steps need a file, use `xyte-cli config path --output json` for secret-store backend diagnostics (`secretStore` may be a backend identifier, not always a file path), and generate reports with `xyte-cli ops report generate` (PDF default, redacted unless include-sensitive is explicitly requested). Do not use source/dev entrypoints like tsx, src, dist, or bin paths.'
