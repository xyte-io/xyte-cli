interface:
  display_name: "Xyte Ops Agent"
  short_description: "Deterministic Xyte CLI ops: first-run setup, api calls, ops inspect/report, util workflows, and headless JSON."
  default_prompt: "Use $xyte-cli as the operational router for @xyteai/cli. Invoke commands directly with `xyte-cli` and stay on the public v2 surface: `init`, `config`, `api`, `ops`, `util`, and `flow`. For fresh installs use `xyte-cli init`, then `xyte-cli setup run --non-interactive --tenant <tenant-id> --key <value>`. Automation must pass `--tenant`, prefer JSON outputs, use `xyte-cli ops console --headless --output json` for machine frames, and generate reports with `xyte-cli ops report generate` (PDF default, redacted unless include-sensitive is explicitly requested). Do not use source/dev entrypoints like npx, tsx, src, dist, or bin paths."
